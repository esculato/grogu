########################### NETWORKS
networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.14.0/24
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.15.0/24
    external: true

########################### SECRETS
secrets:
  plex_claim:
    file: $DOCKERDIR/secrets/plex_claim

services:

  # Docker Socket Proxy - Security Enchanced Proxy for Docker Socket
  socket-proxy:
    container_name: socket-proxy
    image: linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["core", "all"]
    networks:
      socket_proxy:
        ipv4_address: 192.168.14.254 # You can specify a static IP
    privileged: false # true for VM. False (default) for unprivileged LXC container.
    read_only: true
    tmpfs:
      - /run
    environment:
      - LOG_LEVEL=warning # debug,info,notice,warning,err,crit,alert,emerg
      - ALLOW_START=1 # Portainer
      - ALLOW_STOP=1 # Portainer
      - ALLOW_RESTARTS=1 # Portainer
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1 # Watchtower
      # Not always needed
      - BUILD=0 - COMMIT=0 - CONFIGS=0 - CONTAINERS=1 # Traefik, portainer, etc. - DISTRIBUTION=0 - EXEC=0 - 
      - IMAGES=1 # Portainer - INFO=1 # Portainer - NETWORKS=1 # Portainer - NODES=0 - PLUGINS=0 - SERVICES=1 # 
      - Portainer - SESSION=0 - SWARM=0 - SYSTEM=0 - TASKS=1 # Portainer - VOLUMES=1 # Portainer - 
      - DISABLE_IPV6=0 #optional
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      
  agent:
    container_name: portainer_agent
    image: portainer/agent:2.45.2@sha256:4c81dfcb3acc1271d54ca448fb5fe9c8d3bea55b9063cab83643fa1ae4142f73
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["core", "all"]
    networks:
      - default
      - socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Use Docker Socket Proxy instead for improved security
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    ports:
      - $PORTAINER_AGENT_PORT:9001     # Agent API

  dozzle-agent:
    container_name: dozzle_agent
    image: amir20/dozzle:v11.3.1@sha256:ba65da5af3d2147cfc2ee68ea5a6e35b75d2dff7eeff226151a65c9d77831c02
    restart: always
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - $DOZZLE_AGENT_PORT:7007


  ###### DOWNLOADERS

  # TransmissionBT - Torrent Downloader
  # ONLY ACCESSIBLE THROUGH https://domain.com/transmission/web/ if using PathPrefix
  # For Proxmox LXC Containers - https://pve.proxmox.com/wiki/OpenVPN_in_LXC
  transmission-vpn:
    container_name: transmission-vpn
    image: haugene/transmission-openvpn:5.5.2@sha256:845fe4f75bb723919dd72363fae3bb7a2a89b6cb6f807c3b0c4073ebfdd42293
    restart: always
    networks:
      t3_proxy:
        ipv4_address: 192.168.15.169
      socket_proxy:
    cap_add:
      - NET_ADMIN
    devices:
      # Explicitly pass the TUN device from the LXC to the Docker container
      - /dev/net/tun:/dev/net/tun
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - OPENVPN_PROVIDER=WINDSCRIBE
      - OPENVPN_USERNAME=$OPENVPN_USERNAME
      - OPENVPN_PASSWORD=$OPENVPN_PASSWORD
      - OPENVPN_CONFIG=Amsterdam-Tulip-tcp,Brussels-Guildhouse-tcp,Frankfurt-Wiener-tcp
      - OPENVPN_OPTS=--inactive 3600 --ping 10 --ping-exit 60
      - LOCAL_NETWORK=192.168.5.0/24
#      LOCAL_NETWORK: "$LOCAL_NETWORK"
      - UMASK_SET=2
      - TRANSMISSION_RPC_AUTHENTICATION_REQUIRED="false"
      - TRANSMISSION_RPC_HOST_WHITELIST="127.0.0.1,$SERVER_IP"
      - TRANSMISSION_RPC_PASSWORD=$TRANSMISSION_RPC_PASSWORD
      - TRANSMISSION_RPC_USERNAME=$TRANSMISSION_RPC_USERNAME
      - TRANSMISSION_UMASK=002
      - TRANSMISSION_RATIO_LIMIT="0.0099"
      - TRANSMISSION_RATIO_LIMIT_ENABLED="true"
      - TRANSMISSION_ALT_SPEED_DOWN=40000
      - TRANSMISSION_ALT_SPEED_ENABLED="false"
      - TRANSMISSION_ALT_SPEED_UP=250
      - TRANSMISSION_SPEED_LIMIT_DOWN=80000
      - TRANSMISSION_SPEED_LIMIT_DOWN_ENABLED="true"
      - TRANSMISSION_SPEED_LIMIT_UP=500
      - TRANSMISSION_SPEED_LIMIT_UP_ENABLED="true"
      - TRANSMISSION_INCOMPLETE_DIR=/data/downloads/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED="true"
      - TRANSMISSION_WATCH_DIR=/data/downloads
      - TRANSMISSION_WATCH_DIR_ENABLED="true"
      - TRANSMISSION_DOWNLOAD_DIR=/data/downloads
#      LOG_TO_STDOUT: "true"
      - DISABLE_PORT_UPDATER="true"
      - CREATE_TUN_DEVICE="false"
#      TRANSMISSION_WEB_HOME: '/'
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/transmission-vpn/data:/data
      - $DOCKERDIR/appdata/transmission-vpn/config:/config
      - $DATADIR/downloads:/data/downloads
    ports:
      - $TRANSMISSION_PORT:9091
      
  # Jackett
  jackett:
    container_name: jackett
    image: linuxserver/jackett:0.24.2830@sha256:0e6a81ff643e0e28c33136b94891be14855208af1aba14867c818e7cffac1ed7
    restart: unless-stopped
    networks:
      t3_proxy:
        ipv4_address: 192.168.15.170
    depends_on:
      - transmission-vpn
    #network_mode: container:transmission-openvpn
    #security_opt:
    #  - no-new-privileges:true
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/jackett:/config
      - $DATADIR/downloads:/downloads
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/shared:/shared
    ports:
      - $JACKETT_PORT:9117

  # Radarr
  radarr:
    container_name: radarr
    image: linuxserver/radarr:6.4.4@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
    restart: unless-stopped
    networks:
      socket_proxy:
      t3_proxy:
        ipv4_address: 192.168.15.175
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/radarr:/config
      - $DATADIR:/data
    ports:
      - $RADARR_PORT:7878

  # Sonarr
  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:4.0.20@sha256:0deb8db6c839ac475e9cd86277712772c40ba7f929a003d7e1de36c4b666bc13
    restart: unless-stopped
    networks:
      socket_proxy:
      t3_proxy:
        ipv4_address: 192.168.15.176
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/sonarr:/config
      - $DATADIR:/data
    ports:
      - $SONARR_PORT:8989

  # Bazarr
  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr:1.6.2@sha256:fb0437897eaa7f96cf6ac42f795f8dcc208d34ec969eac5d366454e767304eb9
    restart: unless-stopped
    networks:
      socket_proxy:
      t3_proxy:
        ipv4_address: 192.168.15.177
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $DOCKERDIR/appdata/bazarr:/config
      - $DATADIR:/data
    ports:
      - $BAZARR_PORT:6767

  # Jellyfin
  jellyfin:
    container_name: jellyfin
    image: linuxserver/jellyfin:12.2ubu2604-ls54@sha256:799509f8ef3be7037478699cc6fd14d19dd75faac5e474ed219e98ae78a5b3e4
    restart: unless-stopped
    networks:
      - socket_proxy
      - t3_proxy
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - JELLYFIN_PublishedServerUrl=https://jellyfin.kemeel.com #optional
    volumes:
      - $DOCKERDIR/appdata/jellyfin:/config
      - $DATADIR:/data
    #  - /path/to/movies:/data/movies
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    group_add:
      - video
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional

  # File Browser
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    restart: unless-stopped
    networks:
      - socket_proxy
   #   - t3_proxy
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - FB_NOAUTH=true
    volumes:
      - /mnt:/srv/data
      - $DOCKERDIR/appdata/filebrowser/database:/database  
      - $DOCKERDIR/appdata/filebrowser/config:/config
   #   - smb://192.168.5.40:/srv/retropie
    ports:
      - 8070:80

  # Guacamole remote desktop vnc
  guacamole:
    container_name: guacamole
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    restart: unless-stopped
    networks:
      - socket_proxy
    ports:
      - $GUACAMOLE_PORT:8080
    links:
      - guacd
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
      - MYSQL_DATABASE=guacamole
      - MYSQL_USERNAME=$GUACAMOLE_USERNAME_DB
      - MYSQL_PASSWORD=$GUACAMOLE_PASSWORD_DB
      - MYSQL_HOSTNAME=mariadb
      - GUACAMOLE_HOME=$DOCKERDIR/appdata/guacamole
      - GUACD_HOSTNAME=localhost
      - GUACS_PORT=4822

  # Guacamole deamon
  guacd:
    container_name: guacd
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    restart: unless-stopped
    networks:
      - socket_proxy
    environment:
      - LOG_LEVEL=debug


  ##### DATABASES

  # MariaDB - MySQL Database
  mariadb:
    container_name: mariadb
    image: linuxserver/mariadb:11.8.8@sha256:ba1b875720113e3fd1dbc2c5a52b7efa0b32cbf722e99003643c91e2cb99ec53
    restart: unless-stopped
    networks:
      - socket_proxy
    ports:
      - 3306:3306
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/mariadb:/config
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
